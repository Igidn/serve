<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>serve — GPU gateway</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>serve</h1>
          <p>GPU gateway</p>
        </div>
      </div>

      <div class="top-right">
        <a id="tunnel" class="pill pill-muted" href="#" target="_blank" rel="noreferrer">
          <span class="dot"></span><span id="tunnel-text">tunnel…</span>
        </a>
        <button id="identity" class="ghost small" title="Copy the tunnel identity bundle for reuse in the next kernel">
          identity
        </button>
        <div id="gpus" class="gpus"></div>
        <div class="idle" title="The kernel ends when this reaches zero">
          <span class="micro">idle</span>
          <span id="idle">--:--</span>
        </div>
        <button id="power" class="ghost small danger">end session</button>
      </div>
    </header>

    <main>
      <section class="panel models-panel">
        <div class="panel-head">
          <h2>Models</h2>
          <div class="seg" id="filter">
            <button data-filter="all" class="on">all</button>
            <button data-filter="chat">chat</button>
            <button data-filter="image">image</button>
          </div>
        </div>
        <div id="model-list" class="model-list"></div>

        <details id="add-model" class="add">
          <summary>add a Hugging Face model</summary>
          <form id="add-form" autocomplete="off">
            <label>repo<input name="repo" placeholder="owner/name" required /></label>
            <div class="row">
              <label>kind
                <select name="kind">
                  <option value="chat">chat</option>
                  <option value="image">image</option>
                </select>
              </label>
              <label>engine
                <select name="engine">
                  <option value="vllm">vllm</option>
                  <option value="vllm-omni">vllm-omni</option>
                </select>
              </label>
            </div>
            <div class="row">
              <label>tensor parallel<input name="tensor_parallel" type="number" min="1" max="8" value="1" /></label>
              <label>max len<input name="max_model_len" type="number" min="256" step="256" placeholder="auto" /></label>
            </div>
            <label>extra vllm args<input name="extra_args" placeholder="--enforce-eager --trust-remote-code" /></label>
            <label>local path (optional)<input name="local_path" placeholder="/kaggle/input/..." /></label>
            <button type="submit" class="primary">add model</button>
          </form>
        </details>
      </section>

      <section class="stack">
        <section class="panel">
          <div class="panel-head">
            <h2>Active</h2>
            <span id="phase" class="badge">—</span>
          </div>
          <div id="active-body" class="active-body"></div>
          <div id="progress" class="progress" hidden>
            <div class="bar"><span></span></div>
            <div class="progress-label micro"></div>
          </div>
        </section>

        <div class="two">
          <section class="panel">
            <div class="panel-head"><h2>Runtime</h2></div>
            <div id="runtime-body" class="runtime-body"></div>
          </section>

          <section class="panel">
            <div class="panel-head"><h2>Session</h2></div>
            <div id="session-body" class="session-body"></div>
            <div class="setting">
              <label for="idle-input" class="micro">idle timeout (minutes)</label>
              <div class="inline">
                <input id="idle-input" type="number" min="1" max="1440" step="1" />
                <button id="idle-save" class="ghost small">save</button>
              </div>
            </div>
          </section>
        </div>

        <section class="panel logs-panel">
          <div class="panel-head">
            <h2>Logs</h2>
            <div class="seg" id="log-tabs">
              <button data-source="engine" class="on">engine</button>
              <button data-source="install">install</button>
              <button data-source="tunnel">tunnel</button>
              <button data-source="app">app</button>
            </div>
            <label class="follow micro"><input type="checkbox" id="follow" checked /> follow</label>
          </div>
          <pre id="log">waiting for the first request…</pre>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
